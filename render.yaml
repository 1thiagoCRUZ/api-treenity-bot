# Blueprint do Render (https://render.com/docs/blueprint-spec) — define os
# serviços de staging/produção num lugar só, versionado.
#
# `autoDeploy: false` nos dois Web Services é DE PROPÓSITO: sem isso, o Render
# faz deploy sozinho a cada push, sem esperar o CI passar. Quem aciona o deploy
# é o GitHub Actions (.github/workflows/ci.yml), só depois que o job `verify`
# fica verde — ver a seção "Deploy" do README.
#
# Variáveis marcadas com `sync: false` não vêm daqui — são preenchidas manualmente
# no dashboard do Render (Environment → cada serviço), porque são segredos e
# nunca devem ir pro git. Ver .env.example para o que cada uma significa.
#
# NÃO tem serviço `type: cron` aqui: o Render não oferece plano free pra esse
# tipo de serviço (confirmado na hora de aplicar o blueprint — "free not a
# valid plan for service type cron"). A consolidação horária de métricas roda
# via GitHub Actions agendado (.github/workflows/metrics-cron.yml), que é
# grátis em repo público — ver esse arquivo pra detalhe.
services:
  - type: web
    name: api-treenity-bot-staging
    runtime: node
    plan: free
    branch: staging
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: staging
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: SSO_SHARED_SECRET
        sync: false
      - key: N8N_SHARED_SECRET
        sync: false
      - key: CRON_SHARED_SECRET
        sync: false

  - type: web
    name: api-treenity-bot-prod
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: SSO_SHARED_SECRET
        sync: false
      - key: N8N_SHARED_SECRET
        sync: false
      - key: CRON_SHARED_SECRET
        sync: false
