<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Seguro - Treenity</title>
    <link rel="stylesheet" href="chat.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Socket.io client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-info">
                <h2>Portal de Comunicação</h2>
                <p id="connection-status">Desconectado</p>
            </div>
        </div>

        <!-- Etapa 1: Login -->
        <div id="login-area" class="setup-area">
            <h3>Entrar</h3>
            <div class="input-group">
                <label>E-mail:</label>
                <input type="email" id="login-email" autocomplete="username" />
            </div>
            <div class="input-group">
                <label>Senha:</label>
                <input type="password" id="login-senha" autocomplete="current-password" />
            </div>
            <button id="btn-login" class="btn-primary">Entrar</button>
        </div>

        <!-- Etapa 2: Escolher com quem conversar (some após login) -->
        <div id="setup-area" class="setup-area" style="display: none;">
            <h3>Iniciar conversa</h3>
            <p id="logged-as" class="logged-as"></p>
            <div class="input-group">
                <label>ID do destinatário (uuid do outro usuário):</label>
                <input type="text" id="target-id" />
            </div>
            <button id="btn-connect" class="btn-primary">Iniciar Conversa</button>
        </div>

        <!-- Área de Mensagens (Oculto até conectar) -->
        <div id="chat-area" class="chat-area" style="display: none;">
            <div id="messages-list" class="messages-list">
                <!-- As mensagens aparecerão aqui -->
            </div>
            
            <div class="input-area">
                <input type="text" id="message-input" placeholder="Digite sua mensagem segura..." autocomplete="off"/>
                <button id="btn-send" class="btn-send">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
